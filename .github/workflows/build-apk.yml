name: Build APK
on:
  push:
    branches: [ crewroster-mobile ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "cython==0.29.33" "buildozer==1.5.0"

      - name: Cache buildozer global
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Build debug APK
        run: |
          set -o pipefail
          yes | buildozer android debug
        env:
          ANDROIDAPI: "34"
          ANDROIDMINAPI: "24"

      - name: Locate APK
        id: apk
        run: echo "path=$(ls bin/*.apk | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crewroster-apk
          path: bin/*.apk
          if-no-files-found: error
