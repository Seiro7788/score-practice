name: Build APK
on:
  push:
    branches: [ crewroster-mobile ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "cython==3.0.11" "buildozer==1.5.0"

      - name: Cache buildozer global
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      # 캐시 key(hashFiles)는 위 Cache 단계에서 이미 평가됨 → 여기서 spec 을 고쳐도
      # 캐시는 적중. versionCode 를 run_number 로 매 빌드 증가시켜 '더 새 버전'으로
      # 인식되게 함(같은 versionCode 로는 삼성 설치관리자가 덮어쓰기를 거부).
      - name: Bump versionCode (monotonic)
        run: |
          VC=$((10000 + ${{ github.run_number }}))
          sed -i "s/^android.numeric_version = .*/android.numeric_version = ${VC}/" buildozer.spec
          echo "versionCode = ${VC}"

      - name: Use fixed debug keystore (consistent signature → in-place updates)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        # `yes | buildozer` 는 buildozer 종료 후 yes 가 broken pipe 로 1 을 반환해
        # pipefail 때문에 APK 가 정상 빌드돼도 스텝이 실패로 처리됨. 라이선스는
        # android.accept_sdk_license=True 로 자동 수락되므로 파이프 없이 직접 실행.
        run: buildozer android debug
        env:
          ANDROIDAPI: "34"
          ANDROIDMINAPI: "24"

      - name: Locate APK
        id: apk
        run: echo "path=$(ls bin/*.apk | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crewroster-apk
          path: bin/*.apk
          if-no-files-found: error

      # 아티팩트는 Azure blob 로만 받을 수 있어 일부 환경에서 접근이 막힌다.
      # git(github.com)으로는 받을 수 있으므로 APK 를 별도 apk 브랜치에 커밋한다.
      - name: Publish APK to apk branch
        run: |
          APK="$(ls bin/*.apk | head -n1)"
          cp "$APK" /tmp/crewroster.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk
          git reset --hard
          cp /tmp/crewroster.apk ./crewroster.apk
          echo "APK built from $GITHUB_SHA on $(date -u)" > BUILD_INFO.txt
          git add -f crewroster.apk BUILD_INFO.txt
          git commit -m "APK build $GITHUB_SHA"
          git push -f origin apk
