<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=0.5,maximum-scale=4,user-scalable=yes">
<style>
  body { margin: 0; background: #fff; font-family: sans-serif; }
  #osmd { position: relative; }
  .box { position: absolute; pointer-events: none; border-radius: 4px; }
  .play { background: rgba(80,135,255,.20); border: 2px solid rgba(80,135,255,.85); }
  .from { background: rgba(70,190,100,.18); border: 2px solid rgba(70,190,100,.9); }
  .to { background: rgba(255,125,125,.18); border: 2px solid rgba(255,125,125,.9); }
  #msg { padding: 40px 16px; color: #666; }
  .ch { position: absolute; pointer-events: none; text-align: center; line-height: 1.05; white-space: nowrap; transform: translateX(-50%); background: rgba(255,255,255,.88); border-radius: 3px; padding: 0 2px; }
  .ch b { display: block; color: #3f51b5; font-size: 12px; }
  .ch i { display: block; color: #b0306a; font-style: normal; font-size: 11px; }
  .hide .ch { display: none; }
  #dyn { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
  .nodyn #dyn { display: none; }
  .fing { font-family: serif; font-weight: bold; paint-order: stroke; stroke: #fff; stroke-width: 4px; }
  #guide { position: fixed; pointer-events: none; display: none; width: 0; height: 0; }
  #guide span { position: absolute; transform: translate(-50%, -50%); font: bold 20px sans-serif; color: #444; }
  #guide span.on { font-size: 34px; color: #c81e1e; }
  #guide i { position: absolute; transform: translate(-50%, -50%); width: 300px; height: 300px; border-radius: 50%; background: rgba(255,255,255,.55); }
  #noteMark { position: absolute; pointer-events: none; display: none; border: 3px solid #e6005a; border-radius: 50%; }
</style></head>
<body>
<div id="msg">악보를 그리는 중…</div>
<div id="osmd"></div>
<div id="guide"><i></i></div>
<script src="opensheetmusicdisplay.min.js"></script>
<script>
  let osmd = null, boxes = [];
  let range = [-1, -1];
  const marks = {};

  function unit() { return 10 * osmd.zoom; }
  function svgEl() { return document.querySelector('#osmd svg'); }

  // bounding box of every measure (all staves together), in OSMD units
  // a measure is drawn only inside the section shown (long scores are drawn a section at a time)
  function drawn(i) { if (range[0] >= 0 && (i < range[0] || i > range[1])) return false; const m = osmd.GraphicSheet.MeasureList[i]; return !!(m && m.some(g => g && g.ParentMusicSystem)); }
  function collect() {
    boxes = [];
    const ml = osmd.GraphicSheet.MeasureList;
    for (let i = 0; i < ml.length; i++) {
      if (!drawn(i)) { boxes.push(null); continue; }
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, top = 1e9;
      for (const gm of ml[i] || []) {
        if (!gm) continue;
        const ps = gm.PositionAndShape, a = ps.AbsolutePosition;
        x0 = Math.min(x0, a.x + ps.BorderLeft); x1 = Math.max(x1, a.x + ps.BorderRight);
        y0 = Math.min(y0, a.y + ps.BorderTop); y1 = Math.max(y1, a.y + ps.BorderBottom); top = Math.min(top, a.y);
      }
      boxes.push({ i, x0, y0, x1, y1, top });
    }
  }

  function px(b) {
    const s = svgEl().getBoundingClientRect(), host = document.getElementById('osmd').getBoundingClientRect(), u = unit();
    return { left: s.left - host.left + b.x0 * u, top: s.top - host.top + b.y0 * u - 4, w: (b.x1 - b.x0) * u, h: (b.y1 - b.y0) * u + 8 };
  }

  // kind: 'play' | 'from' | 'to'; i < 0 removes it
  const markIdx = {};
  function mark(kind, i, scroll) {
    markIdx[kind] = i;
    if (marks[kind]) { marks[kind].remove(); delete marks[kind]; }
    if (i < 0 || !boxes[i]) return;
    const p = px(boxes[i]), d = document.createElement('div');
    d.className = 'box ' + kind; d.dataset.i = i;
    Object.assign(d.style, { left: p.left + 'px', top: p.top + 'px', width: p.w + 'px', height: p.h + 'px' });
    document.getElementById('osmd').appendChild(d); marks[kind] = d;
    if (scroll) {
      const r = d.getBoundingClientRect();
      if (r.top < 60 || r.bottom > window.innerHeight - 20) window.scrollBy({ top: r.top - window.innerHeight * 0.3, behavior: 'smooth' });
    }
  }

  // chord names + Roman numerals above the measures: [{m, beat (quarters), name, roman}]
  function drawChords(list) {
    document.querySelectorAll('.ch').forEach(e => e.remove());
    const host = document.getElementById('osmd'), s = svgEl().getBoundingClientRect(), h = host.getBoundingClientRect(), u = unit();
    const ml = osmd.GraphicSheet.MeasureList;
    for (const c of list) {
      const b = boxes[c.m]; if (!b) continue;
      let x = b.x0 + 1.5;
      const gm = (ml[c.m] || []).find(g => g && g.staffEntries && g.staffEntries.length);
      if (gm) {
        const e = gm.staffEntries.find(se => se.relInMeasureTimestamp.RealValue * 4 >= c.beat - 0.01);
        if (e) x = e.PositionAndShape.AbsolutePosition.x;
      }
      const d = document.createElement('div'); d.className = 'ch';
      d.innerHTML = '<b></b><i></i>'; d.firstChild.textContent = c.name; d.lastChild.textContent = c.roman;
      d.style.left = (s.left - h.left + x * u) + 'px';
      d.style.top = (s.top - h.top + b.top * u - 36) + 'px';   // just above the top staff line
      host.appendChild(d);
    }
  }
  let chordList = [];
  // semitone colours (same as the coloured PDFs): sharp / double sharp / flat, black key or white key
  const BLACK = [1, 3, 6, 8, 10];
  const COL = { s_b: '#FF7D7D', s_w: '#6E23A0', x_b: '#FFB9B9', x_w: '#736973', f_b: '#5087FF', f_w: '#46BE64' };
  function colorize(on) {
    for (const sm of osmd.Sheet.SourceMeasures) for (const c of sm.VerticalSourceStaffEntryContainers)
      for (const se of c.StaffEntries) if (se) for (const ve of se.VoiceEntries) for (const n of ve.Notes) {
        if (!n.Pitch) continue;
        const a = n.Pitch.AccidentalHalfTones, black = BLACK.includes(((n.halfTone % 12) + 12) % 12);
        let col;
        if (on && a !== 0) col = a >= 2 ? (black ? COL.x_b : COL.x_w) : a === 1 ? (black ? COL.s_b : COL.s_w) : (black ? COL.f_b : COL.f_w);
        n.NoteheadColor = col;
      }
  }
  function setColors(on) { colorize(on); setZoom(osmd.zoom); }
  // redraw at another size (the score re-flows to the screen width); marks and chords follow
  // show measures a..b (indices); -1 = all
  function applyRange() {
    if (range[0] < 0) osmd.setOptions({ drawFromMeasureNumber: 1, drawUpToMeasureNumber: Number.MAX_SAFE_INTEGER });
    else osmd.setOptions({ drawFromMeasureNumber: range[0] + 1, drawUpToMeasureNumber: range[1] + 1 });
  }
  function showRange(a, b, then) {
    range = [a, b];
    setTimeout(() => {                         // let the "drawing…" note appear first
      setZoom(osmd.zoom); window.scrollTo(0, 0);
      if (then) then();
    }, 30);
  }
  function setZoom(z) {
    osmd.zoom = z; applyRange(); osmd.render(); collect();
    drawChords(chordList); drawDyn(dynList); drawMelody(melodyOn); nidx = null; drawFingers();
    for (const k of Object.keys(markIdx)) mark(k, markIdx[k]);
    if (window.Android) Android.onSection(range[0], range[1]);
  }
  // loudness band under each system: thin & pale = ppp ... thick & deep = fff; hairpins become wedges
  let dynList = [];
  function xAt(m, beat, L) {
    const b = boxes[m], gm = (osmd.GraphicSheet.MeasureList[m] || []).find(g => g && g.staffEntries && g.staffEntries.length);
    const pts = [[0, b.x0 + 1]];
    if (gm) for (const se of gm.staffEntries) pts.push([se.relInMeasureTimestamp.RealValue * 4, se.PositionAndShape.AbsolutePosition.x]);
    pts.push([L > 0 ? L : 4, b.x1 - 0.5]);
    pts.sort((p, q) => p[0] - q[0]);
    for (let i = 0; i + 1 < pts.length; i++) if (beat <= pts[i + 1][0]) {
      const [t0, x0] = pts[i], [t1, x1] = pts[i + 1];
      return t1 > t0 ? x0 + (x1 - x0) * (beat - t0) / (t1 - t0) : x0;
    }
    return b.x1;
  }
  function colorOf(v) {   // 25 (pppp) .. 120 (ffff): soft blue -> purple -> deep red
    const k = Math.max(0, Math.min(1, (v - 25) / 95));
    return `hsl(${215 + 140 * k}, ${55 + 25 * k}%, ${72 - 30 * k}%)`;
  }
  function drawDyn(list) {
    const old = document.getElementById('dyn'); if (old) old.remove();
    if (!list.length) return;
    const host = document.getElementById('osmd'), s = svgEl().getBoundingClientRect(), h = host.getBoundingClientRect(), u = unit();
    const ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg');
    svg.id = 'dyn'; svg.setAttribute('width', host.scrollWidth); svg.setAttribute('height', host.scrollHeight);
    const ox = s.left - h.left, oy = s.top - h.top;
    // systems: measures sharing a line
    const lines = {};
    for (const b of boxes) { if (!b) continue; const k = Math.round(b.top); (lines[k] = lines[k] || []).push(b); }
    for (const k of Object.keys(lines)) {
      const ms = lines[k], base = Math.max(...ms.map(b => b.y1)) * u + oy + 24;
      const pts = list.filter(p => p.v !== undefined && ms.some(b => b.i === p.m)).map(p => [ox + xAt(p.m, p.beat, p.L) * u, p.v]);
      for (let i = 0; i + 1 < pts.length; i++) {
        const [x0, v0] = pts[i], [x1, v1] = pts[i + 1]; if (x1 <= x0) continue;
        const h0 = 1 + 9 * (v0 - 25) / 95, h1 = 1 + 9 * (v1 - 25) / 95;
        const poly = document.createElementNS(ns, 'polygon');
        poly.setAttribute('points', `${x0},${base - h0} ${x1},${base - h1} ${x1},${base + h1} ${x0},${base + h0}`);
        poly.setAttribute('fill', colorOf((v0 + v1) / 2)); poly.setAttribute('fill-opacity', '0.85');
        svg.appendChild(poly);
      }
      // hairpins: dark "<" / ">" drawn on the band
      for (const p of list.filter(q => q.pin && ms.some(b => b.i === q.m))) {
        const xa = ox + xAt(p.m, p.beat, p.L) * u;
        const xb = ms.some(b => b.i === p.m2) ? ox + xAt(p.m2, p.beat2, p.L2) * u : Math.max(...ms.map(b => b.x1)) * u + ox;
        if (xb - xa < 4) continue;
        const pl = document.createElementNS(ns, 'polyline'), w = 6, open = p.pin > 0;
        pl.setAttribute('points', open ? `${xb},${base - w} ${xa},${base} ${xb},${base + w}` : `${xa},${base - w} ${xb},${base} ${xa},${base + w}`);
        pl.setAttribute('fill', 'none'); pl.setAttribute('stroke', '#333'); pl.setAttribute('stroke-width', '1.3'); pl.setAttribute('stroke-opacity', '0.75');
        svg.appendChild(pl);
      }
      // sf / sfz / fz: a red spike
      for (const p of list.filter(q => q.acc && ms.some(b => b.i === q.m))) {
        const x = ox + xAt(p.m, p.beat, p.L) * u, tri = document.createElementNS(ns, 'polygon');
        tri.setAttribute('points', `${x - 4},${base + 3} ${x},${base - 13} ${x + 4},${base + 3}`);
        tri.setAttribute('fill', '#D7263D'); tri.setAttribute('fill-opacity', '0.9');
        svg.appendChild(tri);
      }
    }
    host.appendChild(svg);
  }
  function toggleDyn(on) { document.getElementById('osmd').classList.toggle('nodyn', !on); }

  // melodic lines from the voices written in the score (MusicXML voices): one highlighter line per voice,
  // drawn behind the notes. Upper staff: top note of each chord; lower staff: bottom note (bass line).
  // Colours: upper staff main voice yellow, its other voices orange / pink; lower staff cyan / green / violet.
  // Within a line the colour is lighter an octave up and darker an octave down. Lines break at rests and line ends.
  function drawMelody(on) {
    document.querySelectorAll('.melody').forEach(e => e.remove());
    if (!on) return;
    const svg = svgEl(), ns = 'http://www.w3.org/2000/svg', u = 10;   // the score's own SVG units
    const ml = osmd.GraphicSheet.MeasureList, nStaves = Math.max(...ml.map(m => (m || []).length));
    const voices = {};     // key "staff|voice" -> {staff, pts: [[x, y, midi, sys] | null(break)]}
    for (let i = 0; i < ml.length; i++) {
      if (!drawn(i)) continue;
      const sys = Math.round(((ml[i] || [])[0] || { PositionAndShape: { AbsolutePosition: { y: 0 } } }).PositionAndShape.AbsolutePosition.y);
      for (let st = 0; st < (ml[i] || []).length; st++) {
        const gm = ml[i][st]; if (!gm) continue;
        const entries = [...gm.staffEntries].sort((a, b) => a.PositionAndShape.AbsolutePosition.x - b.PositionAndShape.AbsolutePosition.x);
        for (const se of entries) for (const gve of se.graphicalVoiceEntries) {
          const pv = gve.parentVoiceEntry && gve.parentVoiceEntry.ParentVoice;
          const key = st + '|' + (pv ? pv.VoiceId : 0);
          const v = voices[key] || (voices[key] = { staff: st, pts: [] });
          const ns2 = gve.notes.filter(g => g.sourceNote && !g.sourceNote.isRest());
          if (!ns2.length) { v.pts.push(null); continue; }                       // rest: phrase ends
          const lowStaff = st > 0 && st === nStaves - 1 || (nStaves === 2 && st === 1);
          const pick = ns2.reduce((a, b) => (lowStaff ? b.sourceNote.halfTone < a.sourceNote.halfTone : b.sourceNote.halfTone > a.sourceNote.halfTone) ? b : a);
          const p = pick.PositionAndShape.AbsolutePosition;
          v.pts.push([(p.x + 0.6) * u, p.y * u, pick.sourceNote.halfTone, sys]);
        }
      }
    }
    // keep real voices (not a few stray notes); rank them per staff by height
    const all = Object.values(voices), total = all.reduce((t, v) => t + v.pts.filter(Boolean).length, 0);
    const kept = all.filter(v => v.pts.filter(Boolean).length >= Math.max(12, total * 0.03));
    for (const v of kept) { const m = v.pts.filter(Boolean).map(p => p[2]); v.mean = m.reduce((a, b) => a + b, 0) / m.length; }
    const HUES = { upper: [[50, 100, 52], [28, 100, 58], [330, 85, 66]], lower: [[192, 85, 55], [120, 55, 50], [270, 60, 65]] };
    const staves = [...new Set(kept.map(v => v.staff))].sort((a, b) => a - b);
    for (const st of staves) {
      const group = kept.filter(v => v.staff === st).sort((a, b) => b.mean - a.mean);
      const pal = st === staves[0] ? HUES.upper : HUES.lower;
      group.forEach((v, gi) => {
        const [h, sat, l0] = pal[gi % pal.length];
        for (let i = 0; i + 1 < v.pts.length; i++) {
          const a = v.pts[i], b = v.pts[i + 1];
          if (!a || !b || a[3] !== b[3] || b[0] < a[0]) continue;              // rest, new line of music, or wrapped
          const oct = ((a[2] + b[2]) / 2 - v.mean) / 12;                        // +1 = an octave above the voice's middle
          const L = Math.max(25, Math.min(85, l0 + 14 * oct));
          const ln = document.createElementNS(ns, 'line');
          ln.setAttribute('x1', a[0].toFixed(1)); ln.setAttribute('y1', a[1].toFixed(1));
          ln.setAttribute('x2', b[0].toFixed(1)); ln.setAttribute('y2', b[1].toFixed(1));
          ln.setAttribute('class', 'melody'); ln.setAttribute('stroke', `hsl(${h},${sat}%,${L}%)`);
          ln.setAttribute('stroke-opacity', '0.6'); ln.setAttribute('stroke-width', '9'); ln.setAttribute('stroke-linecap', 'round');
          svg.insertBefore(ln, svg.firstChild);                                  // behind the notes
        }
      });
    }
  }
  let melodyOn = true;

  function toggleChords(on) { document.getElementById('osmd').classList.toggle('hide', !on); }

  function measureAt(cx, cy) {
    const s = svgEl().getBoundingClientRect(), u = unit();
    const ux = (cx - s.left) / u, uy = (cy - s.top) / u;
    let best = -1, bd = 1e9;
    for (const b of boxes) {
      if (!b) continue;
      const dx = ux < b.x0 ? b.x0 - ux : ux > b.x1 ? ux - b.x1 : 0;
      const dy = uy < b.y0 ? b.y0 - uy : uy > b.y1 ? uy - b.y1 : 0;
      const d = dx + dy * 2;
      if (d < bd) { bd = d; best = b.i; }
    }
    return bd < 6 ? best : -1;
  }


  // ---------------- fingering on notes: [{m, t, k (midi), n, p (proposal)}]
  let fingers = [], fingerScale = 1;
  function noteIndex() {           // every drawn note head: key "m|t|midi" -> {x, y, st}
    const idx = {}, ml = osmd.GraphicSheet.MeasureList;
    for (let i = 0; i < ml.length; i++) for (let st = 0; st < (ml[i] || []).length; st++) {
      const gm = ml[i][st]; if (!gm || !drawn(i)) continue;
      for (const se of gm.staffEntries) {
        const t = Math.round(se.relInMeasureTimestamp.RealValue * 4 * 96) / 96;
        for (const gve of se.graphicalVoiceEntries) for (const g of gve.notes) {
          if (!g.sourceNote || g.sourceNote.isRest() || !g.sourceNote.Pitch) continue;
          const a = g.PositionAndShape.AbsolutePosition;
          idx[i + '|' + t + '|' + (g.sourceNote.halfTone + 12)] = { m: i, t, k: g.sourceNote.halfTone + 12, x: a.x, y: a.y, st };
        }
      }
    }
    return idx;
  }
  let nidx = null;
  function fkey(f) { return f.m + '|' + (Math.round(f.t * 96) / 96) + '|' + f.k; }
  function setFingers(list, scale) { fingers = list; if (scale) fingerScale = scale; drawFingers(); }
  function drawFingers() {
    document.querySelectorAll('.fing').forEach(e => e.remove());
    if (!osmd || !svgEl()) return;
    nidx = nidx || noteIndex();
    const svg = svgEl(), ns = 'http://www.w3.org/2000/svg', u = 10, fs = 15 * fingerScale;
    const groups = {};                 // one chord (measure, onset, staff) -> its numbers
    for (const f of fingers) {
      const p = nidx[fkey(f)]; if (!p) continue;
      const g = groups[p.m + '|' + p.t + '|' + p.st] || (groups[p.m + '|' + p.t + '|' + p.st] = { st: p.st, x: p.x, ys: [], list: [] });
      g.list.push({ f, y: p.y }); g.x = Math.min(g.x, p.x);
    }
    const nSt = Math.max(...osmd.GraphicSheet.MeasureList.map(m => (m || []).length));
    for (const g of Object.values(groups)) {
      const low = nSt > 1 && g.st === nSt - 1;                // lower staff: numbers below, upper: above
      const notesY = g.list.map(o => o.y);
      if (!low) {
        g.list.sort((a, b) => b.y - a.y);                      // lowest note first, numbers stack upwards
        const top = Math.min(...notesY, 0) ; const base = Math.min(...notesY) - 1.9;
        g.list.forEach((o, j) => put(o.f, g.x, base - j * 1.35));
      } else {
        g.list.sort((a, b) => a.y - b.y);                      // highest first, numbers stack downwards
        const base = Math.max(...notesY) + 2.9;
        g.list.forEach((o, j) => put(o.f, g.x, base + j * 1.35));
      }
    }
    function put(f, x, y) {
      const t = document.createElementNS(ns, 'text');
      t.setAttribute('x', ((x + 0.6) * u).toFixed(1)); t.setAttribute('y', (y * u).toFixed(1));
      t.setAttribute('font-size', fs.toFixed(1)); t.setAttribute('text-anchor', 'middle');
      t.setAttribute('class', 'fing'); t.setAttribute('fill', f.p ? '#e07000' : '#141e78');
      t.textContent = f.n; svg.appendChild(t);
    }
  }

  // fingering mode: press a note, then swipe — 1 = right (0°), 2 ≈ 34°, 3 ≈ 68°, 4 ≈ 101°, 5 = 135° (±15°)
  // left (180°) = leave the mode, down-left (225°) = cancel; a tap on a numbered note removes its number
  let fingerMode = false, fStart = null, fNote = null;
  const ANG = [0, 33.75, 67.5, 101.25, 135], TOL = 15;
  function choice(dx, dy) {
    let a = Math.atan2(-dy, dx) * 180 / Math.PI; if (a < -90) a += 360;
    if (Math.abs(a - 180) <= TOL) return 0;
    if (Math.abs(a - 225) <= TOL) return -2;
    for (let i = 0; i < 5; i++) if (Math.abs(a - ANG[i]) <= TOL) return i + 1;
    return -1;
  }
  function setFingerMode(on) { fingerMode = on; fStart = null; showGuide(null); }
  function noteAt(cx, cy) {
    nidx = nidx || noteIndex();
    const s = svgEl().getBoundingClientRect(), u = unit();
    const ux = (cx - s.left) / u - 0.6, uy = (cy - s.top) / u;
    let best = null, bd = 1e9;
    for (const p of Object.values(nidx)) { const d = Math.hypot((p.x - ux) * 1.3, p.y - uy); if (d < bd) { bd = d; best = p; } }
    return bd < 2.6 ? best : null;
  }
  function showGuide(sel) {
    const gd = document.getElementById('guide'), mk = document.getElementById('noteMark');
    if (!fStart) { gd.style.display = 'none'; if (mk) mk.style.display = 'none'; return; }
    gd.style.display = 'block'; gd.style.left = fStart.x + 'px'; gd.style.top = fStart.y + 'px';
    gd.querySelectorAll('span').forEach(e => e.remove());
    const R = 105, lab = (txt, a, on) => { const e = document.createElement('span'); e.textContent = txt; if (on) e.className = 'on';
      e.style.left = (R * Math.cos(a * Math.PI / 180)) + 'px'; e.style.top = (-R * Math.sin(a * Math.PI / 180)) + 'px'; gd.appendChild(e); };
    for (let i = 0; i < 5; i++) lab(String(i + 1), ANG[i], sel === i + 1);
    lab('완료', 180, sel === 0); lab('취소', 225, sel === -2);
  }
  function markNote(p) {
    let mk = document.getElementById('noteMark');
    if (!mk) { mk = document.createElement('div'); mk.id = 'noteMark'; document.getElementById('osmd').appendChild(mk); }
    if (!p) { mk.style.display = 'none'; return; }
    const s = svgEl().getBoundingClientRect(), host = document.getElementById('osmd').getBoundingClientRect(), u = unit();
    const r = 1.6 * u;
    Object.assign(mk.style, { display: 'block', left: (s.left - host.left + (p.x + 0.6) * u - r) + 'px', top: (s.top - host.top + p.y * u - r) + 'px', width: 2 * r + 'px', height: 2 * r + 'px' });
  }
  document.addEventListener('touchstart', e => {
    if (!fingerMode || e.touches.length !== 1) { fStart = null; showGuide(null); return; }
    const t = e.touches[0]; fNote = noteAt(t.clientX, t.clientY);
    if (!fNote) { fStart = null; return; }
    fStart = { x: t.clientX, y: t.clientY, now: null }; markNote(fNote); showGuide(-1); e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchmove', e => {
    if (!fingerMode || !fStart) return;
    if (e.touches.length !== 1) { fStart = null; showGuide(null); markNote(null); return; }
    const t = e.touches[0]; fStart.now = { x: t.clientX, y: t.clientY };
    const dx = t.clientX - fStart.x, dy = t.clientY - fStart.y;
    showGuide(Math.hypot(dx, dy) > 25 ? choice(dx, dy) : -1); e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchend', e => {
    if (!fingerMode || !fStart) return;
    const end = fStart.now || fStart, dx = end.x - fStart.x, dy = end.y - fStart.y, p = fNote;
    fStart = null; showGuide(null); markNote(null); e.preventDefault();
    if (!window.Android || !p) return;
    if (Math.hypot(dx, dy) < 25) { Android.fingerTap(p.m, p.t, p.k); return; }
    const c = choice(dx, dy);
    if (c >= 1) Android.fingerSet(p.m, p.t, p.k, c); else if (c === 0) Android.fingerExit();
  }, { passive: false });

  async function start(xml, zoom) {
    try {
      osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay('osmd', { autoResize: false, backend: 'svg', drawTitle: true, drawPartNames: false, coloringEnabled: true });
      await osmd.load(xml);
      colorize(window.Android ? Android.showColors() : true);
      osmd.EngravingRules.MinimumDistanceBetweenSystems = 17;   // room for the loudness band and chord labels
      osmd.zoom = zoom || 0.6;
      if (window.Android && Android.range) { const r = JSON.parse(Android.range()); range = [r[0], r[1]]; }
      applyRange();
      osmd.render();
      collect();
      document.getElementById('msg').remove();
      document.getElementById('osmd').addEventListener('click', e => {
        const i = measureAt(e.clientX, e.clientY);
        if (fingerMode) return;
        if (i >= 0 && window.Android) Android.onMeasure(i);
      });
      if (window.Android) {
        try { chordList = JSON.parse(Android.chords()); drawChords(chordList); toggleChords(Android.showChords()); } catch (e) {}
        try { dynList = JSON.parse(Android.dynamics()); drawDyn(dynList); toggleDyn(Android.showDyn()); } catch (e) {}
        try { melodyOn = Android.showMelody(); drawMelody(melodyOn); } catch (e) {}
        try { setFingers(JSON.parse(Android.xfingers()), Android.fingerScale()); } catch (e) {}
        Android.onReady(boxes.length);
      }
    } catch (err) {
      document.getElementById('msg').textContent = '악보를 그리지 못했습니다: ' + err;
      if (window.Android) Android.onError('' + err);
    }
  }

  if (window.Android) start(Android.xml(), Android.zoom());
</script>
